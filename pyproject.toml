[project]
name = "myfinance"
version = "0.1.0"
requires-python = ">=3.13.12,<3.14"
dependencies = [
    "apscheduler==3.10.4",
    "defusedxml==0.7.1",
    "fastapi==0.128.0",
    "httpx<0.28",
    "openai>=2.0.0",
    "pandas==2.3.3",
    "pydantic==2.13.3",
    "pypdf>=5.0.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "pyyaml==6.0.2",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.5.0",
    "sqlalchemy==2.0.36",
    "uvicorn==0.24.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.6",
    "importlib-metadata>=8.7.1",
    "pytest==8.3.5",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[tool.ruff]
extend-exclude = [
    ".codegraph",
    ".worktrees",
    "bank_files",
    "docs",
    "frontend",
]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"

[tool.ty.src]
include = [
    "backend/app",
    "backend/scripts",
    "backend/tests",
    "backup",
    "scripts",
]

[tool.bandit]
exclude_dirs = [
    ".codegraph",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".worktrees",
    "backend/tests",
    "bank_files",
    "docs",
    "frontend",
]

[tool.pytest.ini_options]
addopts = "--ignore=backend/tests/live"
filterwarnings = ["error"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
