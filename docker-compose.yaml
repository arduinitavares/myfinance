services:
  backend:
    build: ./backend
    container_name: myfinance-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - myfinance-data:/app/app/data
    restart: unless-stopped
    environment:
      - TZ=UTC
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MYFINANCE_DATA_DIR=/app/app/data
      - MYFINANCE_PROVIDER_CONFIG=/app/config.local.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: myfinance-frontend
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  myfinance-data:
    driver: local
